<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SignSetu</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="control-panel">
  <button id="start-capture-btn" title="Start Capture">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path><path d="M7 9l3 2-3 2z" fill="currentColor" stroke="none"></path></svg>
    <span>Start Capture</span>
  </button>

  <div id="mode-toggle" role="group" aria-label="Render mode">
    <input type="radio" id="mode-video" name="mode" value="video" checked>
    <label for="mode-video" class="mode-option" title="Video mode">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="M16 10l6-3v10l-6-3z"></path></svg>
    </label>
    <input type="radio" id="mode-avatar" name="mode" value="avatar">
    <label for="mode-avatar" class="mode-option" title="Avatar mode">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>
    </label>
    <span class="mode-toggle-thumb" aria-hidden="true"></span>
  </div>
</div>

<div id="capture-reminder">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
  <span>Make sure the source is playing before sharing.</span>
</div>

<div id="capture-message" class="hidden">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
  <span id="capture-message-text"></span>
  <button id="capture-retry-btn">Retry</button>
</div>

<div id="status-indicator" class="status-idle">
  <span class="status-dot" aria-hidden="true"></span>
  <svg class="status-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
  <span class="status-label">IDLE</span>
</div>

<button id="reconnect-btn" class="icon-btn hidden" title="Reconnect">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>
</button>

<button id="float-output-btn" class="icon-btn" title="Float Output">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><rect x="12" y="12" width="8" height="6" rx="1" fill="currentColor" stroke="none"></rect></svg>
</button>

<div id="output-window">
  <div id="avatar-container" class="render-visible"></div>
  <video id="video-renderer" class="render-hidden" playsinline></video>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
